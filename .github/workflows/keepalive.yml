name: 保持 Supabase 清醒
# Supabase 免費方案 7 天沒有任何請求就會自動暫停（商店會整個打不開）
# 這裡每 3 天自動讀一次商品 id（只回幾個字，幾乎不吃流量）
on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 讀一筆商品
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}"             "https://smrxhnidqqgpccztyesg.supabase.co/rest/v1/active_products?select=id&limit=1"             -H "apikey: sb_publishable_mJyhbGar7MK86XkzdjdzYg_fYoVOJ3h")
          echo "HTTP $code"
          test "$code" = "200"
